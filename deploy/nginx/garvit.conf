# =============================================================================
# Nginx reverse-proxy config — Garvit Buildtech
# PRD §14 / Technical PRD v2.1 §14
#
# Place at: /etc/nginx/sites-available/garvit
# Enable:   ln -s /etc/nginx/sites-available/garvit /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
#
# Architecture: Cloudflare → Nginx (443) → Node/PM2 (127.0.0.1:3000)
# Nginx serves /_next/static and /public directly from disk — Node never
# sees static asset requests.
# =============================================================================

# ─── Real-IP restoration (Cloudflare) ────────────────────────────────────────
# CRITICAL: without this, every request appears to come from Cloudflare's IP
# and application-level rate limiting silently fails (PRD §2.3 risk).
# Cloudflare's current IP ranges: https://www.cloudflare.com/ips/
# Update this list when Cloudflare publishes new ranges.

set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ─── Rate limiting zone (applied to /api/lead) ────────────────────────────────
limit_req_zone $binary_remote_addr zone=lead_api:10m rate=3r/m;

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name garvitbuildtech.com www.garvitbuildtech.com;  # UPDATE THIS

    return 301 https://garvitbuildtech.com$request_uri;
}

# ─── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name garvitbuildtech.com;  # UPDATE THIS

    # ── TLS (Let's Encrypt via Certbot) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/garvitbuildtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garvitbuildtech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Hardening ─────────────────────────────────────────────────────────────
    server_tokens off;
    client_max_body_size 1m;

    # ── Compression ───────────────────────────────────────────────────────────
    # Next.js compression is disabled (next.config.ts: compress: false).
    # Nginx handles it here, more efficiently.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript image/svg+xml
               application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # Brotli (requires ngx_brotli module: apt install nginx-module-brotli)
    # brotli on;
    # brotli_types text/plain text/css application/json application/javascript
    #              text/javascript image/svg+xml;

    # ── Staging: noindex header ───────────────────────────────────────────────
    # Uncomment on the staging server only:
    # add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Next.js static assets (immutable 1yr cache, served from disk) ─────────
    location /_next/static/ {
        alias /var/www/garvit/current/.next/static/;   # UPDATE deploy path
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/garvit-security-headers.conf;
    }

    # ── /public assets (images, fonts, brochures, etc.) ──────────────────────
    location ~ ^/(images|fonts|projects|videos|brochures|floor-plans)/.+\.(webp|png|jpe?g|svg|woff2?|mp4|webm|pdf)$ {
        root /var/www/garvit/current/public;
        try_files $uri =404; #          # UPDATE deploy path
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/garvit-security-headers.conf;
    }

    # ── Lead API — rate-limited ───────────────────────────────────────────────
    location = /api/lead {
        client_max_body_size 16k;
        limit_req zone=lead_api burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for streaming support
        proxy_buffering    off;
        add_header         X-Accel-Buffering "no" always;

        include /etc/nginx/snippets/garvit-security-headers.conf;
    }

    # ── All other routes → Next.js ────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering — required for Next.js App Router streaming
        proxy_buffering    off;
        add_header         X-Accel-Buffering "no" always;

        # Cache prerendered pages at Nginx (short TTL — Cloudflare holds the long cache)
        proxy_cache_valid 200 5m;

        include /etc/nginx/snippets/garvit-security-headers.conf;
    }
}

# Keep the browser Origin and canonical host consistent for lead submissions.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.garvitbuildtech.com;
    ssl_certificate /etc/letsencrypt/live/garvitbuildtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garvitbuildtech.com/privkey.pem;
    return 301 https://garvitbuildtech.com$request_uri;
}
