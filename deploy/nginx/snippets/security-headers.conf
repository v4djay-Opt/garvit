# =============================================================================
# Garvit Buildtech — Nginx security headers
# PRD §15 / Technical PRD v2.1 §15.1
#
# Include this snippet in EVERY location block that can return a response.
# Nginx does NOT inherit add_header from parent blocks when a child block
# declares its own add_header — so every location must include this file.
# Use the `always` flag so headers are also sent on error responses.
#
# Phase 7: change CSP-Report-Only → Content-Security-Policy after clean window.
# =============================================================================

# ─── CSP (Report-Only initially; promote to enforcing in Phase 7) ────────────
# Mirrors the policy in next.config.ts. KEEP BOTH IN SYNC.
#
# NOTE: set $csp_report_uri in nginx.conf if you have a reporting endpoint.
# If empty, the report-uri directive is omitted.

set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://maps.googleapis.com https://maps.gstatic.com https://*.gstatic.com https://www.facebook.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://connect.facebook.net https://www.facebook.com; frame-src https://www.google.com https://td.doubleclick.net; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'";

add_header Content-Security-Policy-Report-Only $csp always;

# ─── Other security headers ───────────────────────────────────────────────────
add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options     "nosniff"                                       always;
add_header X-Frame-Options            "SAMEORIGIN"                                    always;
add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()" always;
